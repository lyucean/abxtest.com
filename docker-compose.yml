
services:

  abx-nginx:
    profiles: ["production"]
    restart: unless-stopped
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ./backend:/var/www/public:ro
      - ./dist:/usr/share/nginx/html:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - abx-php
    networks:
      - abx

  abx-php:
    container_name: abx-php
    restart: unless-stopped
    build: ./docker/php/
    volumes:
      - ./backend:/var/www/public
      - ./.env:/var/www/public/../.env
    networks:
      - abx

  abx-nginx-loc:
    profiles: ["dev"]
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ./backend:/var/www/public/
      - ./dist:/usr/share/nginx/html
    depends_on:
      - abx-php
    networks:
      - abx

networks:
  abx:
    driver: bridge
