name: Deployment

concurrency:
  group: deploy-production
  cancel-in-progress: true

on:
  workflow_dispatch:

env:
  DEPLOY_DIR: /var/www/abxtest.com

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps and build frontend
        run: |
          npm ci
          npm run build

      - name: Заполнение переменных среды
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "TELEGRAM_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
          echo "TELEGRAM_PROXY=${{ secrets.TELEGRAM_PROXY }}" >> .env
          echo "API_DOMAIN=https://abxtest.com/" >> .env
          echo "ENVIRONMENT=Production" >> .env

      - name: Check what changed
        if: github.event_name == 'workflow_dispatch'
        id: changes
        run: |
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED_FILES=$(git diff --name-only --diff-filter=A HEAD)
          fi

          if echo "$CHANGED_FILES" | grep -qE "(docker/php/Dockerfile|docker/php/)"; then
            echo "php_dockerfile_changed=true" >> $GITHUB_OUTPUT
          else
            echo "php_dockerfile_changed=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED_FILES" | grep -qE "(docker/nginx/|docker-compose\.yml)"; then
            echo "nginx_config_changed=true" >> $GITHUB_OUTPUT
          else
            echo "nginx_config_changed=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED_FILES" | grep -qE "(composer\.json|composer\.lock)"; then
            echo "composer_changed=true" >> $GITHUB_OUTPUT
          else
            echo "composer_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync files to deploy directory
        if: github.event_name == 'workflow_dispatch'
        run: |
          RSYNC_EXCLUDES=(
            "--exclude=.git/"
            "--exclude=node_modules/"
            "--exclude=.github/"
            "--exclude=frontend/"
            "--exclude=vendor/"
            "--exclude=*.mp3"
            "--exclude=*.wav"
            "--exclude=*.flac"
            "--exclude=*.ogg"
            "--exclude=*.aac"
            "--exclude=*.m4a"
            "--exclude=*.opus"
            "--exclude=*.aiff"
            "--exclude=*.aif"
            "--exclude=*.alac"
            "--exclude=*.ape"
            "--exclude=package*.json"
            "--exclude=webpack.config.js"
            "--exclude=Makefile"
            "--exclude=README.md"
          )
          rsync -az --delete "${RSYNC_EXCLUDES[@]}" \
            ./docker-compose.yml ./docker ./certbot ./backend ./dist ./.env \
            "${DEPLOY_DIR}/"

      - name: Smart deploy
        if: github.event_name == 'workflow_dispatch'
        env:
          PHP_DOCKERFILE_CHANGED: ${{ steps.changes.outputs.php_dockerfile_changed }}
          NGINX_CONFIG_CHANGED: ${{ steps.changes.outputs.nginx_config_changed }}
          COMPOSER_CHANGED: ${{ steps.changes.outputs.composer_changed }}
        run: |
          set -e
          export COMPOSE_DOCKER_CLI_BUILD=1
          export DOCKER_BUILDKIT=1
          cd "${DEPLOY_DIR}"

          mkdir -p certbot/www

          if [ -f /etc/letsencrypt/live/abxtest.com/fullchain.pem ]; then
            echo "Найден сертификат Let's Encrypt, включаем HTTPS"
            cp docker/nginx/production.conf docker/nginx/active.conf
          else
            echo "Сертификат не найден, запускаем HTTP-конфиг для certbot"
            cp docker/nginx/production.http.conf docker/nginx/active.conf
          fi

          if [ "$PHP_DOCKERFILE_CHANGED" = "true" ]; then
            echo "Пересобираем PHP образ (изменился Dockerfile)..."
            docker compose --profile production build abx-php
          else
            echo "PHP образ не изменился, пропускаем сборку"
          fi

          docker compose --profile production up -d abx-php

          if [ "$NGINX_CONFIG_CHANGED" = "true" ]; then
            docker compose --profile production up -d --force-recreate abx-nginx
          else
            docker compose --profile production up -d abx-nginx
          fi

          if [ "$COMPOSER_CHANGED" = "true" ] || [ ! -f ./backend/vendor/autoload.php ]; then
            echo "Обновляем зависимости Composer..."
            docker compose exec -T abx-php bash -c "composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader"
          else
            echo "Зависимости не изменились, пропускаем composer install"
          fi

          docker compose --profile production ps

      - name: Smoke test
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -f /etc/letsencrypt/live/abxtest.com/fullchain.pem ]; then
            curl -fsSL --max-time 15 https://abxtest.com/
          else
            curl -fsSL --max-time 15 http://abxtest.com/
          fi

      - name: Get commit message
        if: github.event_name == 'workflow_dispatch'
        id: commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send telegram message on deploy
        if: github.event_name == 'workflow_dispatch'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ${{ github.actor }} создал commit:
            Commit: ${{ steps.commit.outputs.message }}

            Репозиторий: ${{ github.repository }}

            Изменения: https://gitverse.ru/${{ github.repository }}/commit/${{ github.sha }}
